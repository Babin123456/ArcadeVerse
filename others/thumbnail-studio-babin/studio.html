<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Thumbnail & Promo Studio | ArcadeVerse DevTools</title>
  <link rel="stylesheet" href="studio.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="studio-container">
    <header class="header">
      <div class="header-title-box">
        <h1>Arcade <span>Thumbnail & Promo Studio</span></h1>
        <p class="header-subtitle">Create standardized 16:9 arcade game promotional cards, scanline banners, and social watermark cards.</p>
      </div>
      <div>
        <a href="../../index.html" class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to Hub
        </a>
      </div>
    </header>

    <div class="workbench-layout">
      <!-- Preview Frame -->
      <div class="preview-panel">
        <div class="canvas-frame">
          <canvas id="promo-canvas" width="1280" height="720"></canvas>
        </div>

        <div style="display: flex; gap: 10px; width: 100%; max-width: 720px;">
          <label class="btn" style="flex: 1; justify-content: center; cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            Upload Game Capture
            <input type="file" id="file-input" accept="image/*" style="display: none;">
          </label>
          <button class="btn btn-secondary" id="btn-copy-img" title="Copy to Clipboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            Copy Image
          </button>
          <button class="btn btn-primary" id="btn-download-webp">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Export WebP
          </button>
        </div>
      </div>

      <!-- Controls Panel -->
      <div class="controls-panel">
        <div class="section-label">Aspect Ratio</div>
        <div class="ratio-toggle">
          <button class="ratio-btn active" data-ratio="16:9">16:9 Banner</button>
          <button class="ratio-btn" data-ratio="1:1">1:1 Square</button>
          <button class="ratio-btn" data-ratio="4:3">4:3 Retro</button>
        </div>

        <div class="section-label" style="margin-top: 10px;">Card Metadata</div>
        <div class="form-group">
          <label for="input-title">Game Title</label>
          <input type="text" id="input-title" class="form-input" value="Neon Cyber Runner">
        </div>

        <div class="form-group">
          <label for="input-author">Author Tag</label>
          <input type="text" id="input-author" class="form-input" value="@Babin123456">
        </div>

        <div class="form-group">
          <label for="input-category">Category</label>
          <select id="input-category" class="form-input">
            <option value="Arcade">Arcade</option>
            <option value="Action">Action</option>
            <option value="Puzzle">Puzzle</option>
            <option value="Strategy">Strategy</option>
            <option value="Classic">Classic</option>
            <option value="Rhythm">Rhythm</option>
          </select>
        </div>

        <div class="section-label" style="margin-top: 10px;">Post-Processing Shaders</div>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="chk-scanlines" checked> CRT Raster Scanlines
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-vignette" checked> Edge Phosphor Vignette
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-chromatic" checked> Chromatic Aberration (RGB Split)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-nsoc" checked> NSoC '26 Verified Badge
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-watermark" checked> ArcadeVerse Logo Watermark
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="shader-filters.js"></script>
  <script src="canvas-compositor.js"></script>
  <script src="export-manager.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("promo-canvas");
      const compositor = new CanvasCompositor(canvas);

      function syncOptions() {
        compositor.options.title = document.getElementById("input-title").value;
        compositor.options.author = document.getElementById("input-author").value;
        compositor.options.category = document.getElementById("input-category").value;
        compositor.options.showScanlines = document.getElementById("chk-scanlines").checked;
        compositor.options.showVignette = document.getElementById("chk-vignette").checked;
        compositor.options.showChromatic = document.getElementById("chk-chromatic").checked;
        compositor.options.showNsocBadge = document.getElementById("chk-nsoc").checked;
        compositor.options.showWatermark = document.getElementById("chk-watermark").checked;
        compositor.render();
      }

      // Input bindings
      document.getElementById("input-title").addEventListener("input", syncOptions);
      document.getElementById("input-author").addEventListener("input", syncOptions);
      document.getElementById("input-category").addEventListener("change", syncOptions);
      document.querySelectorAll(".checkbox-group input").forEach(chk => {
        chk.addEventListener("change", syncOptions);
      });

      // Ratio toggles
      document.querySelectorAll(".ratio-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".ratio-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          compositor.setAspectRatio(btn.dataset.ratio);
        });
      });

      // Image upload
      document.getElementById("file-input").addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            compositor.setImage(img);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      // Export Buttons
      document.getElementById("btn-download-webp").addEventListener("click", () => {
        const title = compositor.options.title.toLowerCase().replace(/[^a-z0-9]/g, "-");
        ThumbnailExportManager.downloadImage(canvas, "webp", `promo_${title}`);
      });

      document.getElementById("btn-copy-img").addEventListener("click", async () => {
        const btn = document.getElementById("btn-copy-img");
        try {
          await ThumbnailExportManager.copyToClipboard(canvas);
          const orig = btn.innerHTML;
          btn.textContent = "Copied to Clipboard!";
          setTimeout(() => btn.innerHTML = orig, 2000);
        } catch (err) {
          alert("Clipboard copy error: " + err.message);
        }
      });

      compositor.render();
    });
  </script>
</body>
</html>
