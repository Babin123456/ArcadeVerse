<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Keybind Remapper | ArcadeVerse Controls</title>
  <link rel="stylesheet" href="keybind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="keybind-container">
    <header class="header">
      <div class="header-title-box">
        <h1>Universal <span>Keybind Remapper</span></h1>
        <p class="header-subtitle">Custom arcade controller mapping, visual keyboard heatmap, and transparent input adapter exporter.</p>
      </div>
      <div>
        <a href="../../index.html" class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          Back to Hub
        </a>
      </div>
    </header>

    <!-- Preset Schemes -->
    <div class="presets-bar">
      <div class="section-label">Preset Layouts</div>
      <button class="preset-chip active" data-preset="wasd">WASD Modern</button>
      <button class="preset-chip" data-preset="arrows">Classic Arrows</button>
      <button class="preset-chip" data-preset="numpad">Retro Numpad</button>
      <div id="conflict-badge" style="margin-left: auto; font-size: 0.75rem; color: #10b981; font-weight: 700;">
        Zero Key Conflicts Detected
      </div>
    </div>

    <!-- Interactive Visual Keyboard Card -->
    <div class="keyboard-card">
      <div class="section-label" style="margin-bottom: 8px;">Interactive Keyboard Heatmap (Press Any Physical Key)</div>
      <div id="virtual-keyboard-container"></div>
    </div>

    <!-- Main Grid -->
    <div class="workbench-grid">
      <!-- Action Mapping Editor -->
      <div class="panel">
        <div class="section-label">Arcade Action Bindings</div>
        <div id="bindings-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <!-- Generated Adapter Code -->
      <div class="panel">
        <div class="section-label">Drop-In Game Input Adapter Code</div>
        <div class="code-box" id="code-output"></div>
        <button class="btn btn-primary" id="btn-copy-code" style="justify-content: center; margin-top: auto;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy Adapter Script
        </button>
      </div>
    </div>
  </div>

  <script src="profile-manager.js"></script>
  <script src="virtual-keyboard.js"></script>
  <script src="input-adapter.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let activeProfile = KeybindProfileManager.getActiveProfile();
      let listeningAction = null;

      const kbContainer = document.getElementById("virtual-keyboard-container");
      const virtualKb = new VirtualKeyboard(kbContainer, selectedCode => {
        if (listeningAction) {
          activeProfile.bindings[listeningAction] = selectedCode;
          listeningAction = null;
          saveAndRender();
        }
      });

      function saveAndRender() {
        KeybindProfileManager.saveProfile(activeProfile);
        virtualKb.setBindings(activeProfile.bindings);
        renderActionList();

        // Check conflicts
        const conflicts = KeybindProfileManager.detectConflicts(activeProfile.bindings);
        const badge = document.getElementById("conflict-badge");
        if (conflicts.length > 0) {
          badge.style.color = "#ef4444";
          badge.textContent = conflicts[0];
        } else {
          badge.style.color = "#10b981";
          badge.textContent = "Zero Key Conflicts Detected";
        }

        // Output code
        const code = ArcadeInputAdapterGenerator.generateAdapterCode(activeProfile);
        document.getElementById("code-output").textContent = code;
      }

      function renderActionList() {
        const listContainer = document.getElementById("bindings-list");
        listContainer.innerHTML = "";

        Object.entries(activeProfile.bindings).forEach(([action, code]) => {
          const row = document.createElement("div");
          row.className = "action-map-row";
          row.innerHTML = `
            <span class="action-name">${action}</span>
            <button class="action-key-input ${listeningAction === action ? 'listening' : ''}">
              ${listeningAction === action ? 'Press key...' : code}
            </button>
          `;

          row.querySelector("button").addEventListener("click", () => {
            listeningAction = action;
            renderActionList();
          });

          listContainer.appendChild(row);
        });
      }

      // Physical key press listeners
      window.addEventListener("keydown", e => {
        virtualKb.highlightKey(e.code, true);

        if (listeningAction) {
          e.preventDefault();
          activeProfile.bindings[listeningAction] = e.code;
          listeningAction = null;
          saveAndRender();
        }
      });

      window.addEventListener("keyup", e => {
        virtualKb.highlightKey(e.code, false);
      });

      // Presets
      document.querySelectorAll(".preset-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          document.querySelectorAll(".preset-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          activeProfile = JSON.parse(JSON.stringify(KEYBIND_PRESETS[chip.dataset.preset]));
          saveAndRender();
        });
      });

      // Copy code
      document.getElementById("btn-copy-code").addEventListener("click", () => {
        const code = document.getElementById("code-output").textContent;
        navigator.clipboard.writeText(code).then(() => {
          const btn = document.getElementById("btn-copy-code");
          const orig = btn.innerHTML;
          btn.textContent = "Copied to Clipboard!";
          setTimeout(() => btn.innerHTML = orig, 2000);
        });
      });

      saveAndRender();
    });
  </script>
</body>
</html>
