name: Auto-Build Games Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'games/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'games/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Community Games Pre-Flight
        run: node scripts/validate-games.js

      - name: Compile Games Registry & Contributor Stats
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-registry.js

      - name: Commit & Push Updated Registry
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/games-registry.js
          if git diff --staged --quiet; then
            echo "No registry changes detected."
          else
            git commit -m "chore(registry): auto-compile games-registry.js [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
