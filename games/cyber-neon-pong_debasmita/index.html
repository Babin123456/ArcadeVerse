<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Neon Pong | ArcadeVerse</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Favicon and Brand Icons -->
  <link rel="icon" type="image/x-icon" href="../../assets/public/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/public/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/public/apple-touch-icon.png">
</head>
<body>
  <div class="game-header">
    <div class="game-title" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <i data-lucide="gamepad-2"></i> Cyber Neon Pong
    </div>
    <div class="author-badge">Created by @DebasmitaBose0</div>
  </div>

  <div class="score-board" role="status" aria-live="polite">
    <span>Player: <strong id="player-score" style="color:#38bdf8;">0</strong></span>
    <span>AI: <strong id="ai-score" style="color:#f43f5e;">0</strong></span>
  </div>

  <canvas id="pongCanvas" width="600" height="380" role="img" aria-label="Cyber Neon Pong interactive court" tabindex="0"></canvas>

  <p class="instructions">Control paddle using <strong>Mouse / Touch</strong> or <strong>Arrow Keys / W & S</strong></p>

  <script src="game.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
