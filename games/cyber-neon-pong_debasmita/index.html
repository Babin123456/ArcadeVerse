<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Neon Pong | ArcadeVerse</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-header {
      text-align: center;
      margin-bottom: 12px;
    }
    .game-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .author-badge {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .score-board {
      display: flex;
      gap: 32px;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      padding: 6px 18px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    canvas {
      background: #0d1322;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.2);
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    .instructions {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      padding: 0 1rem;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="game-header">
    <div class="game-title" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <i data-lucide="gamepad-2"></i> Cyber Neon Pong
    </div>
    <div class="author-badge">Created by @DebasmitaBose0</div>
  </div>

  <div class="score-board" role="status" aria-live="polite">
    <span>Player: <strong id="player-score" style="color:#38bdf8;">0</strong></span>
    <span>AI: <strong id="ai-score" style="color:#f43f5e;">0</strong></span>
  </div>

  <canvas id="pongCanvas" width="600" height="380" role="img" aria-label="Cyber Neon Pong interactive court" tabindex="0"></canvas>

  <p class="instructions">Control paddle using <strong>Mouse / Touch</strong> or <strong>Arrow Keys / W & S</strong></p>

  <script src="game.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
